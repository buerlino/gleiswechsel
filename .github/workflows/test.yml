name: Test

# The core unit tests, lint and the app build on every branch push and pull request, so a broken
# app shows before a tag. Tags are left to release.yml, which runs them too.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: ./gradlew :core:test :app:lintDebug :app:assembleDebug
